<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فێربوونی پیتەکانی عەرەبی</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .badge {
            background-color: #e74c3c;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .letter-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .letter-btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        .harakat-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select {
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 5px;
        }

        .harakat-buttons button {
            font-size: 1.1rem;
            padding: 8px 12px;
            margin: 2px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .harakat-buttons button:hover {
            background-color: #27ae60;
        }

        .display-box {
            font-size: 4rem;
            text-align: center;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 8px;
        }

        .status-msg {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<!-- دوگمە و پەنجەرەی ڕێکخستنەکان -->
<button id="settingsBtn" style="padding: 8px 15px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; font-size: 16px;">⚙️ ڕێکخستنەکان</button>

<div id="settingsModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: #ffffff; margin: 10% auto; padding: 20px; width: 320px; border-radius: 8px; position: relative;">
        <span class="close-btn" style="position: absolute; left: 15px; top: 10px; font-size: 24px; cursor: pointer;">&times;</span>
        <h2 id="modalTitle">ڕێکخستنەکانی بەرنامە</h2>
        
        <div style="margin-top: 15px;">
            <label id="langLabel" style="display: block; margin-bottom: 5px; font-weight: bold;">زمان (Language):</label>
            <select id="langSelect" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="ku">کوردی</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>

        <div style="margin-top: 15px;">
            <label id="themeLabel" style="display: block; margin-bottom: 5px; font-weight: bold;">دۆخی ڕوکار (Theme):</label>
            <div style="display: flex; gap: 10px;">
                <button id="lightModeBtn" style="flex: 1; padding: 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px;">☀️ ڕووناک</button>
                <button id="darkModeBtn" style="flex: 1; padding: 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px;">🌙 تاریک</button>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <label id="colorLabel" style="display: block; margin-bottom: 5px; font-weight: bold;">ڕەنگی پشتەوە (Background Color):</label>
            <input type="color" id="bgColorPicker" value="#ffffff" style="width: 100%; padding: 4px; height: 35px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
    </div>
</div>
    <header>
        <h1>فێربوونی پیت و حەرەکاتی عەرەبی</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>١. ژمارەی پیتەکانی عەرەبی</h2>
            <p>زمانی عەرەبی پێکهاتووە لە <span id="letter-count" class="badge">0</span> پیتی سەرەکی.</p>
        </section>

        <section class="card">
            <h2>٢. گوێگرتن لە دەنگی پیتەکان</h2>
            <p>لە سەر هەر پیتێک بدە بۆ ئەوەی گوێت لە دەنگەکەی بێت:</p>
            <div id="alphabet-grid" class="grid-container"></div>
            <div id="voice-status" class="status-msg"></div>
        </section>

        <section class="card">
            <h2>٣. ڕاهێنانی حەرەکەکان</h2>
            <div class="harakat-controls">
                <select id="letter-select"></select>
                <div class="harakat-buttons">
                    <button onclick="speakHarakah('َ')">فەتحە ( َ )</button>
                    <button onclick="speakHarakah('ُ')">زەمە ( ُ )</button>
                    <button onclick="speakHarakah('ِ')">کەسڕە ( ِ )</button>
                    <button onclick="speakHarakah('ْ')">سوکون ( ْ )</button>
                </div>
            </div>
            <div class="display-box" id="harakah-display">أ</div>
        </section>
    </main>

    <script>
        const arabicAlphabet = [
            'أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 
            'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 
            'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 
            'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'
        ];

        document.getElementById('letter-count').innerText = arabicAlphabet.length;

        const grid = document.getElementById('alphabet-grid');
        const select = document.getElementById('letter-select');
        const statusDiv = document.getElementById('voice-status');

        arabicAlphabet.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.innerText = letter;
            btn.onclick = () => playSound(letter);
            grid.appendChild(btn);

            const option = document.createElement('option');
            option.value = letter;
            option.innerText = letter;
            select.appendChild(option);
        });

        let availableVoices = [];
        let selectedArabicVoice = null;

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            // Find an Arabic voice available in Chrome/Windows
            selectedArabicVoice = availableVoices.find(voice => voice.lang.startsWith('ar'));
            
            if (!selectedArabicVoice && availableVoices.length > 0) {
                statusDiv.innerText = "Warning: No Arabic speech voice found on your system. Please install Arabic in Windows settings.";
                statusDiv.style.color = "#e74c3c";
            } else if (selectedArabicVoice) {
                statusDiv.innerText = `Voice loaded: ${selectedArabicVoice.name}`;
                statusDiv.style.color = "#27ae60";
            }
        }

        // Chrome loads voices asynchronously
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function playSound(text) {
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.8;

            if (selectedArabicVoice) {
                utterance.voice = selectedArabicVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakHarakah(harakah) {
            const selectedLetter = select.value;
            const combinedText = selectedLetter + harakah;
            
            document.getElementById('harakah-display').innerText = combinedText;
            playSound(combinedText);
const modal = document.getElementById("settingsModal");
    const btn = document.getElementById("settingsBtn");
    const span = document.getElementsByClassName("close-btn")[0];
    const lightBtn = document.getElementById("lightModeBtn");
    const darkBtn = document.getElementById("darkModeBtn");
    const langSelect = document.getElementById("langSelect");
    const bgColorPicker = document.getElementById("bgColorPicker");

    btn.onclick = () => modal.style.display = "block";
    span.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

    lightBtn.onclick = () => {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    };

    darkBtn.onclick = () => {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    };

    bgColorPicker.oninput = (e) => {
        const selectedColor = e.target.value;
        document.body.style.backgroundColor = selectedColor;
        localStorage.setItem('bgColor', selectedColor);
    };

    langSelect.onchange = (e) => {
        const lang = e.target.value;
        localStorage.setItem('lang', lang);
        updateLanguage(lang);
    };

    function updateLanguage(lang) {
        if (lang === 'en') {
            btn.innerText = "⚙️ Settings";
            document.getElementById("modalTitle").innerText = "App Settings";
            document.getElementById("langLabel").innerText = "Language:";
            document.getElementById("themeLabel").innerText = "Theme Mode:";
            document.getElementById("colorLabel").innerText = "Background Color:";
            lightBtn.innerText = "☀️ Light";
            darkBtn.innerText = "🌙 Dark";
        } else if (lang === 'ar') {
            btn.innerText = "⚙️ Settings";
            document.getElementById("modalTitle").innerText = "إعدادات التطبيق";
            document.getElementById("langLabel").innerText = "اللغة (Language):";
            document.getElementById("themeLabel").innerText = "وضع المظهر (Theme):";
            document.getElementById("colorLabel").innerText = "لون الخلفية (Background Color):";
            lightBtn.innerText = "☀️ فاتح";
            darkBtn.innerText = "🌙 داكن";
        } else {
            btn.innerText = "⚙️ ڕێکخستنەکان";
            document.getElementById("modalTitle").innerText = "ڕێکخستنەکانی بەرنامە";
            document.getElementById("langLabel").innerText = "زمان (Language):";
            document.getElementById("themeLabel").innerText = "دۆخی ڕوکار (Theme):";
            document.getElementById("colorLabel").innerText = "ڕەنگی پشتەوە (Background Color):";
            lightBtn.innerText = "☀️ ڕووناک";
            darkBtn.innerText = "🌙 تاریک";
        }
    }

    window.onload = () => {const modal = document.getElementById("settingsModal");
    const btn = document.getElementById("settingsBtn");
    if (btn && modal) {
        btn.onclick = () => { modal.style.display = "block"; };
    }
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedColor = localStorage.getItem('bgColor');
        if (savedColor) {
            document.body.style.backgroundColor = savedColor;
            bgColorPicker.value = savedColor;
        }

        const savedLang = localStorage.getItem('lang') || 'ku';
        langSelect.value = savedLang;
        updateLanguage(savedLang);
    };        }
// کلیلە سەرەکییەکانی ڕێکخستن
    const modal = document.getElementById("settingsModal");
    const btn = document.getElementById("settingsBtn");
    const span = document.querySelector(".close-btn");
    const lightBtn = document.getElementById("lightModeBtn");
    const darkBtn = document.getElementById("darkModeBtn");
    const langSelect = document.getElementById("langSelect");
    const bgColorPicker = document.getElementById("bgColorPicker");

    if (btn && modal) {
        btn.onclick = () => { modal.style.display = "block"; };
    }
    if (span && modal) {
        span.onclick = () => { modal.style.display = "none"; };
    }
    window.onclick = (e) => { 
        if (e.target == modal) { modal.style.display = "none"; } 
    }

    if (lightBtn) {
        lightBtn.onclick = () => {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        };
    }

    if (darkBtn) {
        darkBtn.onclick = () => {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        };
    }

    if (bgColorPicker) {
        bgColorPicker.oninput = (e) => {
            const selectedColor = e.target.value;
            document.documentElement.style.setProperty('--bg-color', selectedColor);
            localStorage.setItem('bgColor', selectedColor);
        };
    }

    if (langSelect) {
        langSelect.onchange = (e) => {
            const lang = e.target.value;
            localStorage.setItem('lang', lang);
            updateLanguage(lang);
        };
    }

    function updateLanguage(lang) {
        const modalTitle = document.getElementById("modalTitle");
        const langLabel = document.getElementById("langLabel");
        const themeLabel = document.getElementById("themeLabel");
        const colorLabel = document.getElementById("colorLabel");

        if (lang === 'en') {
            if (btn) btn.innerText = "⚙️ Settings";
            if (modalTitle) modalTitle.innerText = "App Settings";
            if (langLabel) langLabel.innerText = "Language:";
            if (themeLabel) themeLabel.innerText = "Theme Mode:";
            if (colorLabel) colorLabel.innerText = "Background Color:";
            if (lightBtn) lightBtn.innerText = "☀️ Light";
            if (darkBtn) darkBtn.innerText = "🌙 Dark";
        } else if (lang === 'ar') {
            if (btn) btn.innerText = "⚙️ الإعدادات";
            if (modalTitle) modalTitle.innerText = "إعدادات التطبيق";
            if (langLabel) langLabel.innerText = "اللغة (Language):";
            if (themeLabel) themeLabel.innerText = "وضع المظهر (Theme):";
            if (colorLabel) colorLabel.innerText = "لون الخلفية (Background Color):";
            if (lightBtn) lightBtn.innerText = "☀️ فاتح";
            if (darkBtn) darkBtn.innerText = "🌙 داكن";
        } else {
            if (btn) btn.innerText = "⚙️ ڕێکخستنەکان";
            if (modalTitle) modalTitle.innerText = "ڕێکخستنەکانی بەرنامە";
            if (langLabel) langLabel.innerText = "زمان (Language):";
            if (themeLabel) themeLabel.innerText = "دۆخی ڕوکار (Theme):";
            if (colorLabel) colorLabel.innerText = "ڕەنگی پشتەوە (Background Color):";
            if (lightBtn) lightBtn.innerText = "☀️ ڕووناک";
            if (darkBtn) lightBtn.innerText = "🌙 تاریک";
        }
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const savedColor = localStorage.getItem('bgColor');
        if (savedColor && bgColorPicker) {
            document.documentElement.style.setProperty('--bg-color', savedColor);
            bgColorPicker.value = savedColor;
        }

        const savedLang = localStorage.getItem('lang') || 'ku';
        if (langSelect) {
            langSelect.value = savedLang;
        }
        updateLanguage(savedLang);
    };    </script>
</body>
</html>
